[project]
name = "aivhuman-api"
version = "0.1.0"
description = "FastAPI backend for the aivhuman web app"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    # Scorer + GPT-2/spaCy features. train extra pulls torch, transformers, spacy.
    "aivhuman[train]",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivhuman_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "RUF", "ARG", "C4", "TID"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.13"
packages = ["aivhuman_api"]
strict = true

# uv only reads sources from the project being installed, so ml/'s are repeated here.
[tool.uv.sources]
aivhuman = { path = "../ml", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Same stub-less third party modules as ml/.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "spacy.*", "pysbd.*", "tokenizers.*", "wordfreq.*"]
ignore_missing_imports = true
