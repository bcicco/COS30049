[project]
name = "aivhuman"
version = "0.1.0"
description = "Sentence-scored AI-text detection: corpus normalisation and MIL detector"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pysbd==0.3.4",
    # RAID acquisition
    "datasets>=4.8,<5",
    "huggingface-hub>=0.34,<1",
    # Token counting without dragging in torch.
    "tokenizers>=0.21,<1",
    # Parquet checkpoints and fast CSV scanning.
    "pyarrow>=17",
    # JSONL write throughput at 500k+ documents.
    "orjson>=3.10",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.11",
]
# Phase 3 onward only. torch is smt like 2.5 GB installed and Phase 1 doesn't use it.
train = [
    "torch>=2.6",
    "transformers>=4.48",
    "scikit-learn>=1.5",
    "accelerate>=1.0",
    "pandas>=2.2,<3",
]

[project.scripts]
aivhuman-data = "aivhuman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivhuman"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "RUF", "ARG", "C4", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = ["network: hits real corpora over the network; excluded from CI"]

[tool.mypy]
python_version = "3.13"
packages = ["aivhuman"]
strict = true
